name: Seed Test Product

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Insert test product in first active store
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          if (!process.env.DATABASE_URL) throw new Error('Missing DATABASE_URL');
          const sql = neon(process.env.DATABASE_URL);
          const rows = await sql(`
            with keep as (
              select id
              from app.products
              where sku like 'TEST-SKU-%'
              order by created_at desc
              limit 1
            ), deleted as (
              delete from app.products
              where sku like 'TEST-SKU-%'
                and id not in (select id from keep)
              returning id
            )
            select p.id, p.company_id, p.sku, p.slug, p.name, p.price, p.currency,
                   c.slug as store_slug
            from app.products p
            join app.companies c on c.id = p.company_id
            where p.sku like 'TEST-SKU-%'
            order by p.created_at desc
            limit 1
          `);
          if (!rows.length) throw new Error('No test product found to clean.');
          console.log(JSON.stringify(rows[0]));
          NODE
